name = "study"
main = "src/worker.js"
compatibility_date = "2025-09-01"

routes = [
  { pattern = "study.simpleornothing.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
MODEL = "claude-sonnet-5-5"

# Secrets (wrangler secret put …):
#   ANTHROPIC_API_KEY  필수
#   ACCESS_CODE        선택 — 설정하면 접속 코드를 알아야만 AI 기능을 쓸 수 있음
